name: e2e-test

on:
  push:
    branches:
      - main
      - feature/*
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "NOTICE"
  schedule:
    # UTC 時間で毎日 2:00 (JST で 11:00) に実行、月曜日から金曜日
    - cron: "0 2 * * 1-5"

jobs:
  e2e-test:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: ["22", "24", "26"]
        # browser: ["chromium", "firefox", "webkit"]
        browser: ["chromium"]
    env:
      VITE_SORA_SIGNALING_URL: ${{ secrets.TEST_SIGNALING_URL }}
      VITE_SORA_CHANNEL_ID: "sora-js-sdk-examples-e2e-test"
      VITE_SORA_CHANNEL_ID_PREFIX: ${{ secrets.TEST_CHANNEL_ID_PREFIX }}
      VITE_SECRET_KEY: ${{ secrets.TEST_SECRET_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: ${{ matrix.node }}
          cache: true
          run-install: true
      - run: vp exec playwright install ${{ matrix.browser }} --with-deps
      - run: vp exec playwright test --project=${{ matrix.browser }}
        env:
          VITE_SORA_CHANNEL_ID_SUFFIX: _${{ matrix.node }}
      # - uses: actions/upload-artifact@v4
      #   if: always()
      #   with:
      #     name: playwright-report
      #     path: playwright-report/
      #     retention-days: 30

  slack_notify:
    needs: [e2e-test]
    runs-on: ubuntu-slim
    if: ${{ always() }}
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Slack Notification
        uses: shiguredo/github-actions/.github/actions/slack-notify@main
        with:
          status: ${{ job.status }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
          slack_channel: sora-js-sdk
          slack_title: Failed
          slack_icon_emoji_failure: ":japanese_ogre:"
          notify_mode: failure_only
        env:
          GH_TOKEN: ${{ github.token }}
